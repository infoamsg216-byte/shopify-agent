<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Shopify Agent</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1b1b1b);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .box {
      background: #1f1f1f;
      padding: 40px;
      border-radius: 24px;
      width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      margin-bottom: 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #00c853;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
    }

    button:hover {
      background: #00e676;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      border-radius: 12px;
      background: #111;
      display: none;
      line-height: 1.5;
    }

    .success {
      color: #00e676;
    }

    .error {
      color: #ff5252;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>AI Shopify Agent 🚀</h1>
    <p>Génère automatiquement des produits Shopify avec l’IA.</p>

    <label>Niche</label>
    <input type="text" id="niche" placeholder="ex: skincare, fitness, gaming" />

    <label>Nombre de produits</label>
    <input type="number" id="count" value="3" min="1" max="20" />

    <button id="btn" onclick="generateProducts()">Générer Produits</button>

    <div id="result"></div>
  </div>

  <script>
    async function generateProducts() {
      const niche = document.getElementById("niche").value.trim();
      const count = document.getElementById("count").value;
      const result = document.getElementById("result");
      const btn = document.getElementById("btn");

      if (!niche) {
        result.style.display = "block";
        result.innerHTML = "<span class='error'>❌ Entre une niche.</span>";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Génération...";
      result.style.display = "block";
      result.innerHTML = "⏳ Génération en cours...";

      try {
        const response = await fetch(
          `/generate-products?niche=${encodeURIComponent(niche)}&count=${count}`
        );

        const data = await response.json();

        if (data.success) {
          result.innerHTML = `
            <span class="success">✅ ${data.products_created} produit(s) créé(s) avec succès !</span><br>
            Va vérifier dans Shopify → Produits.
          `;
        } else {
          result.innerHTML = "<span class='error'>❌ Erreur pendant la génération.</span>";
        }
      } catch (error) {
        result.innerHTML = "<span class='error'>❌ Erreur de connexion API.</span>";
      }

      btn.disabled = false;
      btn.innerText = "Générer Produits";
    }
  </script>
</body>
</html>
